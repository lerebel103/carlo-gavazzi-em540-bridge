em540_master:
  # Whether to use serial RS485 (RTU) or TCP communication to the energy meter
  # Possible values: serial, tcp
  mode: serial

  # --------------------------------------------------------------------------
  # If serial mode is used, configure the following parameters accordingly
  baudrate: 9600
  parity: N
  bytesize: 8
  stopbits: 1
  # Enable this when the serial adapter echoes transmitted bytes back to the master
  handle_local_echo: false
  serial_port: /dev/ttyUSB0
  # --------------------------------------------------------------------------

  # --------------------------------------------------------------------------
  # If tcp mode is used, configure the following parameters
  host: 192.168.102.240
  port: 8899
  slave_id: 1
  # --------------------------------------------------------------------------

  # Master read interval in seconds, 10Hz max supported rate by EM540/EM530
  update_interval: 0.1
  # Read timeout in seconds (keep below update_interval for best 10Hz stability)
  timeout: 0.08
  # Number of retries on read failure
  retries: 0
  # Log level for the master component
  log_level: INFO

em540_slave:
  # The EM540 slave data model can be served over TCP, RTU-over-TCP, and/or
  # an optional serial adapter at the same time.
  host: 0.0.0.0
  # Port for Modbus RTU over TCP
  rtu_port: 5002
  # Port for Modbus TCP
  tcp_port: 5001
  # Slave ID assumed by the emulated slave
  slave_id: 1
  # Timeout for client requests
  update_timeout: 0.5
  # Seconds of serial-request inactivity after which a downstream serial client
  # is reported as disconnected (serial has no transport disconnect event, so
  # client presence is inferred from recent request activity).
  serial_idle_timeout: 5.0
  # Log level info for this component
  log_level: INFO
  # Optional Modbus/RTU serial adapter (disabled by default)
  serial:
    enabled: false
    port: /dev/ttyUSB1
    baudrate: 9600
    parity: N
    bytesize: 8
    stopbits: 1
    timeout: 0.5
    handle_local_echo: false

ts65a_slave:
  # The TS65A slave data model can be served over TCP and/or an optional
  # serial adapter at the same time.
  host: 0.0.0.0
  # Port for Modbus TCP
  port: 5003
  # Slave ID assumed by the emulated slave
  slave_id: 1
  # Timeout for client requests
  update_timeout: 0.5
  # Seconds of serial-request inactivity after which a downstream serial client
  # is reported as disconnected (serial has no transport disconnect event, so
  # client presence is inferred from recent request activity).
  serial_idle_timeout: 5.0
  # Grid feed-in hard limit in Watts (negative value). This is used to track when we are over this limit
  grid_feed_in_hard_limit: -5000
  # Number of points to use for smoothing the power values when checking against the hard limit
  smoothing_num_points: 20
  # Log level info for this component
  log_level: INFO
  # Optional Modbus/RTU serial adapter (disabled by default)
  serial:
    enabled: false
    port: /dev/ttyUSB2
    baudrate: 9600
    parity: N
    bytesize: 8
    stopbits: 1
    timeout: 0.5
    handle_local_echo: false

mqtt:
  # Whether to enable MQTT integration from the top level.
  enabled: true
  # Optional prefix added to all Home Assistant MQTT topics for test isolation.
  # Leave blank for normal production topics.
  ha_topic_prefix: ""
  # MQTT broker connection parameters
  host: localhost
  port: 1883
  username: ""
  password: ""
  # Update interval in seconds for publishing the values to MQTT
  update_interval: 1.0
  # Log level for the MQTT component
  log_level: INFO

health:
  # Heartbeat file the service writes and the Docker healthcheck reads. Kept on
  # tmpfs (/tmp) so writes are cheap and leave no disk residue.
  file: /tmp/em540_bridge_health.json
  # How often (seconds) the heartbeat file is written. Keep well below the Docker
  # healthcheck interval so the reader always sees a fresh file.
  write_interval: 1.0
  # Window (seconds) the acquisition rate is averaged over (smooths transient dips).
  rate_window: 5.0
  # Fraction of the configured rate that must be met to be healthy (0.9 == within 10%).
  rate_margin: 0.9
  # When em540_master.update_interval is 0 (unpaced/max rate), the actual rate must
  # exceed this floor (reads/sec) to be healthy.
  unpaced_min_rate_hz: 10.0
  # TCP port the healthcheck probes for downstream-server liveness (TS65A emulation).
  tcp_probe_port: 5003

pymodbus:
  log_level: INFO

root:
    log_level: INFO
