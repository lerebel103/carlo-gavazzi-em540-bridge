# ============================================================================
# Staleness protection ladder (fail-closed). Every tier is independent and
# fails CLOSED. The tiers are listed by role, NOT by threshold magnitude:
# the consumer-facing wall-clock breakers (tiers 1-2) come first, then the
# upstream detectors that cause them to fire (tiers 3-4), then the last-resort
# self-exit (tier 5). The thresholds are therefore not monotonic by design
# (0.5 -> 3.0 -> 1.0 -> 5.0 -> 30.0); each tier is tuned for its own consumer
# or detector, not to fire in numeric order.
#
#   1. Downstream Modbus bridge wall-clock breaker — em540_slave.update_timeout /
#      ts65a_slave.update_timeout = 0.5s. Bounds Modbus consumers: a per-request
#      breaker that returns a Modbus exception instead of stale registers. Blind
#      to a meter that keeps emitting a repeating-but-valid frame (that refreshes
#      the frame timestamp and keeps this breaker satisfied).
#   2. HA/MQTT wall-clock freshness watchdog (NEW) — mqtt.ha_max_stale_s = 3.0s.
#      Bounds MQTT/HA consumers: marks HA unavailable on wall-clock frame age.
#      Same blind spot as tier 1 (a refreshing timestamp satisfies it).
#   3. Upstream stale/duplicate-frame detector —
#      em540_master.stale_frame_detection.max_stale_s = 1.0s. This is the REASON
#      data stops flowing for a stuck-but-plausible meter: it detects a repeating
#      frame (identical fast-changing registers) and fails closed, which is what
#      then trips tiers 1/2. Blind to a frame that keeps changing plausibly.
#   4. Persistent-invalid-frame gate —
#      em540_master.frame_validation.max_consecutive_invalid_s = 5.0s. Fails
#      closed when frames persistently violate the spec/physical bounds. Blind to
#      an in-range but wrong value.
#   5. Last-resort process self-exit — em540_master.health_max_stale_s = 30.0s
#      (runtime floor ~25s, 40s startup grace). Exits so Docker restarts a wedged
#      instance. Coarsest tier; only fires when nothing fresher recovered.
#
# Modbus consumers are bound by tier 1; MQTT/HA by tier 2. Tiers 3/4 are the
# reason data stops flowing for a stuck-but-plausible meter (a repeating-but-
# valid frame refreshes data.timestamp and would otherwise keep every wall-clock
# breaker satisfied), not the only thing stopping it.
# ============================================================================

em540_master:
  # Whether to use serial RS485 (RTU) or TCP communication to the energy meter
  # Possible values: serial, tcp
  mode: serial

  # --------------------------------------------------------------------------
  # If serial mode is used, configure the following parameters accordingly
  baudrate: 9600
  parity: N
  bytesize: 8
  stopbits: 1
  # Enable this when the serial adapter echoes transmitted bytes back to the master
  handle_local_echo: false
  serial_port: /dev/ttyUSB0
  # --------------------------------------------------------------------------

  # --------------------------------------------------------------------------
  # If tcp mode is used, configure the following parameters
  host: 192.168.102.240
  port: 8899
  slave_id: 1
  # --------------------------------------------------------------------------

  # Master read interval in seconds, 10Hz max supported rate by EM540/EM530
  update_interval: 0.1
  # Read timeout in seconds (keep below update_interval for best 10Hz stability)
  timeout: 0.08
  # Number of retries on read failure
  retries: 0
  # Upstream-freshness watchdog: seconds without a fresh upstream frame before
  # the process self-exits so Docker's restart policy recovers a wedged
  # instance. Set to 0 (or negative) to disable. Keep comfortably above the
  # reconnect backoff ceiling (5s) so ordinary reconnects never trip it. Values
  # between 0 and ~25s are clamped up at runtime so the Docker 'unhealthy'
  # transition always precedes self-exit (see docker-compose.yaml healthcheck).
  health_max_stale_s: 30.0
  # Meter configuration enforcement on connect. The measurement mode, measuring
  # system, and wiring-check status are ALWAYS read and logged (human-readable +
  # raw value) on every connect. These flags only control whether a corrective
  # write is attempted. Not exposed to Home Assistant.
  #
  # Force measurement mode to C / Bidirectional (register 0x1103 -> 2). Safe and
  # non-destructive. No-op on read-only MID (PFx) meters, where the mode is fixed
  # by the part number (a rejected write is logged, not fatal).
  ensure_bidirectional_mode: false
  # Force measuring system to 3Pn / 3-phase with neutral (register 0x1002 -> 0).
  # WARNING: changing the measuring system may reset the meter's kWh counters, so
  # this is disabled by default.
  ensure_3phase_measuring_system: false
  # Upstream frame validation. Each parsed frame is checked against the meter's
  # documented overflow sentinel and physical limits before it is published or
  # folded into daily min/max. A failing frame is dropped (last-good value is
  # retained) and counted as an "RS485 Invalid Frames" diagnostic. A lone/
  # transient bad frame is absorbed; once rejections persist past
  # max_consecutive_invalid_s (below) the master directly fails closed (opens the
  # downstream breaker, marks HA unavailable), independent of the staleness
  # watchdog.
  frame_validation:
    enabled: true
    # Reject if an INT32 instantaneous variable's MSW == 0x7FFF
    # (EM500_CPP_Mod_V1.3 section 3.3 "Maximum electrical values").
    check_overflow_sentinel: true
    # Physical bounds. The two current bounds apply to EM540 / direct-input
    # meters ONLY: an EM530 is CT-connected and derives its per-phase and
    # system (An) current bound from the meter CT ratio (register 0x1003),
    # ignoring these two values. Voltage/frequency bounds apply to both models.
    max_phase_current_a: 130.0    # EM540/direct-input only; 2 x Imax(65 A)
    max_system_current_a: 390.0   # EM540/direct-input only; 3 x per-phase bound
    max_voltage_ln_v: 360.0       # 1.5 x Un(240 V)
    max_voltage_ll_v: 625.0       # ~1.5 x L-L(415 V)
    min_frequency_hz: 40.0        # datasheet 45 Hz minus 5 Hz guard
    max_frequency_hz: 70.0        # datasheet 65 Hz plus 5 Hz guard
    # Seconds since the last ACCEPTED frame after which PERSISTENT rejections
    # fail closed (downstream breaker opens, HA goes unavailable). A single/
    # transient bad frame is still absorbed; independent of health_max_stale_s.
    max_consecutive_invalid_s: 5.0
  # Upstream stale/duplicate-frame safeguard. The meter can serve the same frame
  # twice when polled faster than its internal update loop (the true poll rate,
  # e.g. 12.5Hz, exceeds update_interval) and — more dangerously — can wedge and
  # repeat one frame forever while still answering. Each accepted frame is reduced
  # to an equality composite over six fast-changing primary-block registers (the
  # three phase currents and the system power/apparent/reactive totals; voltage
  # and frequency are excluded as too stable). Consecutive identical composites
  # are counted stale, and once a stall lasts at least max_stale_s the master
  # fails closed (downstream breaker opens, HA goes unavailable) exactly like the
  # invalid-frame gate; a genuinely fresh frame resets the stall and resumes
  # publishing. The threshold is in SECONDS (not a poll count), so it is
  # independent of the meter's true poll rate and of health_max_stale_s.
  stale_frame_detection:
    enabled: true
    # Idle guard: an all-zero composite (no load — P, VA, var and all three
    # currents == 0) is a legitimate zero-throughput idle state and is NEVER
    # counted stale or allowed to open the breaker.
    max_stale_s: 1.0
  # Log level for the master component
  log_level: INFO

em540_slave:
  # The EM540 slave data model can be served over TCP, RTU-over-TCP, and/or
  # an optional serial adapter at the same time.
  host: 0.0.0.0
  # Port for Modbus RTU over TCP
  rtu_port: 5002
  # Port for Modbus TCP
  tcp_port: 5001
  # Slave ID assumed by the emulated slave
  slave_id: 1
  # Timeout for client requests
  update_timeout: 0.5
  # Seconds of serial-request inactivity after which a downstream serial client
  # is reported as disconnected (serial has no transport disconnect event, so
  # client presence is inferred from recent request activity).
  serial_idle_timeout: 5.0
  # Log level info for this component
  log_level: INFO
  # Optional Modbus/RTU serial adapter (disabled by default)
  serial:
    enabled: false
    port: /dev/ttyUSB1
    baudrate: 9600
    parity: N
    bytesize: 8
    stopbits: 1
    timeout: 0.5
    handle_local_echo: false
    # Serial-only frame-latching. A downstream serial client can poll faster than
    # the upstream meter refreshes, which would otherwise return DUPLICATE frames.
    # When enabled, a serial read blocks until a NEW upstream frame has landed in
    # the downstream registers (latching the serial client to the upstream refresh
    # rate), then releases immediately — minimum end-to-end latency, no duplicates.
    # TCP and RTU-over-TCP clients are unaffected.
    pacing_enabled: true
    # Maximum seconds a serial read blocks waiting for a fresh frame. Default 0.12s
    # ~= 1.5x the ~80ms (12.5Hz) upstream period and MUST stay well below the real
    # downstream serial client READ TIMEOUT of 200ms (and below this bridge's
    # serial.timeout above and the 0.5s downstream breaker update_timeout). A value
    # <= 0 disables latching (today's behaviour, duplicate frames possible).
    # Validation rejects pacing_max_wait_s >= serial.timeout when serial and pacing
    # are both enabled.
    pacing_max_wait_s: 0.12
    # The downstream serial CLIENT's read timeout (milliseconds) — the real wire
    # deadline the frame latch must respect, NOT the adapter `timeout` above.
    # A latched read first waits for a fresh frame and then clocks the response
    # out over the serial line; at 9600 8N1 (10 bits/byte) a worst-case response
    # takes well over 100ms to serialize. The effective latch wait is therefore
    # clamped below client_read_timeout_ms - serialization_time - turnaround_margin,
    # and validation rejects a pacing_max_wait_s that cannot fit the response
    # inside this deadline. Default 200ms matches a typical serial client read
    # timeout; raise it only if the real client tolerates longer reads.
    client_read_timeout_ms: 200

ts65a_slave:
  # The TS65A slave data model can be served over TCP and/or an optional
  # serial adapter at the same time.
  host: 0.0.0.0
  # Port for Modbus TCP
  port: 5003
  # Slave ID assumed by the emulated slave
  slave_id: 1
  # Timeout for client requests
  update_timeout: 0.5
  # Seconds of serial-request inactivity after which a downstream serial client
  # is reported as disconnected (serial has no transport disconnect event, so
  # client presence is inferred from recent request activity).
  serial_idle_timeout: 5.0
  # Grid feed-in hard limit in Watts (negative value). This is used to track when we are over this limit
  grid_feed_in_hard_limit: -5000
  # Duration in seconds over which downstream readings are time-averaged (smoothed).
  # Frame-rate independent. 0 disables smoothing (serve latest value). Max 15 seconds.
  # 2.0s matches the previous default of 20 samples at the 10Hz (0.1s) master cadence.
  smoothing_window_seconds: 2.0
  # Log level info for this component
  log_level: INFO
  # Optional Modbus/RTU serial adapter (disabled by default)
  serial:
    enabled: false
    port: /dev/ttyUSB2
    baudrate: 9600
    parity: N
    bytesize: 8
    stopbits: 1
    timeout: 0.5
    handle_local_echo: false
    # Serial-only frame-latching. A downstream serial client can poll faster than
    # the upstream meter refreshes, which would otherwise return DUPLICATE frames.
    # When enabled, a serial read blocks until a NEW upstream frame has landed in
    # the downstream registers (latching the serial client to the upstream refresh
    # rate), then releases immediately — minimum end-to-end latency, no duplicates.
    # TCP clients are unaffected.
    pacing_enabled: true
    # Maximum seconds a serial read blocks waiting for a fresh frame. Default 0.12s
    # ~= 1.5x the ~80ms (12.5Hz) upstream period and MUST stay well below the real
    # downstream serial client READ TIMEOUT of 200ms (and below this bridge's
    # serial.timeout above and the 0.5s downstream breaker update_timeout). A value
    # <= 0 disables latching (today's behaviour, duplicate frames possible).
    # Validation rejects pacing_max_wait_s >= serial.timeout when serial and pacing
    # are both enabled.
    pacing_max_wait_s: 0.12
    # The downstream serial CLIENT's read timeout (milliseconds) — the real wire
    # deadline the frame latch must respect, NOT the adapter `timeout` above.
    # A latched read first waits for a fresh frame and then clocks the response
    # out over the serial line; at 9600 8N1 (10 bits/byte) a worst-case response
    # takes well over 100ms to serialize. The effective latch wait is therefore
    # clamped below client_read_timeout_ms - serialization_time - turnaround_margin,
    # and validation rejects a pacing_max_wait_s that cannot fit the response
    # inside this deadline. Default 200ms matches a typical serial client read
    # timeout; raise it only if the real client tolerates longer reads.
    client_read_timeout_ms: 200

mqtt:
  # Whether to enable MQTT integration from the top level.
  enabled: true
  # Optional prefix added to all Home Assistant MQTT topics for test isolation.
  # Leave blank for normal production topics.
  ha_topic_prefix: ""
  # MQTT broker connection parameters
  host: localhost
  port: 1883
  username: ""
  password: ""
  # Update interval in seconds for publishing the values to MQTT
  update_interval: 1.0
  # HA/MQTT wall-clock freshness watchdog (staleness ladder tier 2). Max seconds
  # since the last upstream frame before the HA bridge marks itself unavailable
  # (retained "offline" on the availability topic) and stops publishing fresh
  # sensor state. This is the MQTT path's OWN self-protecting staleness breaker:
  # it fires on wall-clock frame age independent of any master signal, so HA never
  # shows silently stale values. Default 3.0s is ~3x update_interval (above) so a
  # single missed publish does not flap HA offline. Detection is bounded by the
  # MQTT publish wake cadence (update_interval), so staleness is caught at worst
  # one update_interval late. Set to 0 (or negative) to disable the watchdog.
  ha_max_stale_s: 3.0
  # Log level for the MQTT component
  log_level: INFO

pymodbus:
  log_level: INFO

root:
    log_level: INFO
