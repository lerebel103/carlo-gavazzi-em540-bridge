services:
  carlo-gavazzi-em540-bridge:
    image: lerebel103/carlo-gavazzi-em540-bridge:latest
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: carlo-gavazzi-em540-bridge
    restart: unless-stopped
    init: true
    volumes:
      - ./config.yaml:/etc/carlo-gavazzi-em540-bridge/config.yaml
    environment:
      TZ: Australia/Perth
    # Real-time performance optimizations
    cap_add:
      - SYS_NICE  # Allow setting high scheduler priority
    # Give this container stronger CPU scheduling weight versus other containers.
    # (Default is 1024; higher means preferred CPU time under contention.)
    cpu_shares: 4096
    # Keep this container less likely to be OOM-killed than non-critical workloads.
    # Valid range: -1000 (protect most) .. 1000 (kill first).
    oom_score_adj: -900
    # Allow high-priority scheduling knobs from inside the container.
    # Host/kernel policy still applies (see notes below).
    ulimits:
      rtprio: 99
      nice: -20
      memlock: -1
    ports:
      - 5001:5001  # Modbus TCP
      - 5002:5002  # Modbus RTU-over-TCP
      - 5003:5003  # Fronius TS-65-A emulation
    # Resource limits — steady-state RSS is ~50-60MB. The 128M cap ensures
    # the OOM killer fires early if there's a leak, before the Pi is under
    # system-wide memory pressure that would freeze the host.
    # Note: `deploy.resources` is enforced in Swarm mode. For plain
    # `docker compose up`, use service-level `cpus`/`mem_limit` if you need
    # hard limits there as well.
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 128M
        reservations:
          cpus: '0.5'
          memory: 64M
    # Container logging (limit log file size to prevent disk bloat)
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    # Freshness healthcheck (observability). The bridge writes the last
    # successful upstream frame's epoch seconds to /dev/shm from a dedicated
    # watchdog thread (off the pinned tick core, no process spawned by the app,
    # independent of MQTT); this probe reports the container unhealthy in
    # `docker ps` once that stamp is stale. The probe is a pure-shell integer
    # comparison — it never boots a Python interpreter, so it cannot starve the
    # 10Hz loop. A missing/zero file (pre-first-frame) reads as unhealthy,
    # absorbed by start_period during boot/reconnect.
    #
    # Recovery ordering: Docker/Compose does NOT restart a container just because
    # it is unhealthy (restart policies only react to the container exiting).
    # Automatic recovery is driven application-side: the same watchdog thread
    # self-exits when no fresh upstream frame has arrived within
    # em540_master.health_max_stale_s, and `restart: unless-stopped` above
    # restarts it. The probe timing is deliberately tuned so the container is
    # observably `unhealthy` BEFORE the app self-exits — otherwise it would
    # restart before Docker ever flipped the status and the observability signal
    # would be lost. Worst-case unhealthy time (probe reads a stamp already up to
    # the 15s age limit old, then needs `retries` consecutive failures spaced by
    # `interval`):
    #   steady-state: 15 (age limit) + retries*interval = 15 + 2*5 = ~25s
    #   cold start:   start_period suppresses failures, then retries*interval
    #                 after it = 20 + 2*5 = ~30s
    # The app keeps self-exit strictly later: steady-state >= health_max_stale_s
    # (clamped to a >=25s floor) + poll, and cold start is gated by a 40s grace.
    # If you raise health_max_stale_s that only widens the margin; the code
    # enforces the lower bound so this ordering cannot be misconfigured away.
    healthcheck:
      test:
        - CMD-SHELL
        - test $(( $(date +%s) - $(cat /dev/shm/em540_health 2>/dev/null || echo 0) )) -lt 15
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 20s
    # Explicitly run the bridge at high process priority inside the container.
    # This requires SYS_NICE + appropriate ulimits above.
    command:
      - nice
      - -n
      - "-20"
      - uv
      - run
      - --frozen
      - --no-sync
      - python
      - -m
      - app
      - --config
      - /etc/carlo-gavazzi-em540-bridge/config.yaml
    # Uncomment the following for development/debugging (interactive shell access)
    # stdin_open: true
    # tty: true
    #devices:
        # Adjust according to your setup, if using a USB to RS485 adapter
        #- /dev/ttyUSB0:/dev/ttyUSB0


